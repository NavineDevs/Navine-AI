name: Navine CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pillow numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
      - name: Unit tests
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          python -m pytest tests -q --ignore=tests/test_external_diffusion.py || python -m pytest tests/test_native_bridge.py -q
      - name: Schedules smoke
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          python -c "from navine.image.schedules import make_beta_schedule; b=make_beta_schedule(10, schedule='cosine'); assert len(b)==10"
          python -c "from navine.native_bridge import native_status, matmul; print(native_status()); assert matmul([[1,2],[3,4]],[[5,6],[7,8]])"
